[project]
name = "option-pricing-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "loridelotto", email = "lorenzo.delotto@mail.polimi.it" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
    "yfinance>=1.7.0",
]

[project.scripts]
option-pricing-engine = "option_pricing_engine:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
]
